<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Mīere</title>
    <link rel="icon" type="image/x-icon" href="css/favicon/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <!-- HEADER -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="css/imgs/ManukaCo_Long_BloodOrange.png" alt="Mīere Logo">
            </a>
        </div>

        <nav class="nav-links">
            <a href="story.html" data-text="Our Story">Our Story</a>
            <a href="shop.html" data-text="Shop">Shop</a>
            <a href="membership.html" data-text="Membership">Membership</a>
            <a href="blog.html" data-text="Blog">Blog</a>
            <a href="faq.html" data-text="FAQs">FAQs</a>
            <a href="contact.html" class="active" data-text="Contact Us">Contact Us</a>
        </nav>

        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </header>

    <section class="container">
        <!-- IMAGE SLIDESHOW SECTION -->
        <section class="image-section" id="slideshow">
            <img src="css/imgs/product/miere5.png" class="active" alt="Image 1" />
            <img src="css/imgs/product/miere12.png" alt="Image 2" />
            <img src="css/imgs/product/miere30.png" alt="Image 3" />
        </section>

        <!-- CONTACT FORM SECTION -->
        <section class="form-section">
            <h2>Contact Us</h2>
            <form id="contactForm" novalidate>
                <!-- Name field -->
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required />
                <div class="error" id="nameError"></div>

                <!-- Email field -->
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required />
                <div class="error" id="emailError"></div>

                <!-- Category dropdown -->
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="support">Support</option>
                    <option value="sales">Sales</option>
                    <option value="feedback">Feedback</option>
                    <!-- Add more categories as needed -->
                </select>
                <div class="error" id="categoryError"></div>

                <!-- Message field -->
                <label for="message">Message *</label>
                <textarea id="message" name="message" required></textarea>
                <div class="error" id="messageError"></div>

                <!-- Submit button -->
                <button type="submit">Submit</button>
            </form>
        </section>
    </section>

    <script>
        // Image slideshow with cycle and dissolve transition
        const images = document.querySelectorAll('#slideshow img');
        let currentIndex = 0;
        const totalImages = images.length;

        function showNextImage() {
            // Hide current image
            images[currentIndex].classList.remove('active');

            // Move to next image
            currentIndex = (currentIndex + 1) % totalImages;

            // Show next image
            images[currentIndex].classList.add('active');
        }

        // Cycle images every 3 seconds
        setInterval(showNextImage, 3000);

        // Form validation
        const form = document.getElementById('contactForm');

        form.addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent default submission

            // Clear previous errors
            document.querySelectorAll('.error').forEach(el => el.textContent = '');

            let isValid = true;

            // Validate Name: not only spaces
            const nameInput = document.getElementById('name');
            const nameValue = nameInput.value.trim();
            if (nameValue === '') {
                isValid = false;
                document.getElementById('nameError').textContent = 'Please enter your name.';
            }

            // Validate Email: valid email
            const emailInput = document.getElementById('email');
            const emailValue = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailValue === '') {
                isValid = false;
                document.getElementById('emailError').textContent = 'Please enter your email.';
            } else if (!emailPattern.test(emailValue)) {
                isValid = false;
                document.getElementById('emailError').textContent = 'Please enter a valid email.';
            }

            // Validate Category: required and not default
            const categorySelect = document.getElementById('category');
            if (categorySelect.value === '') {
                isValid = false;
                document.getElementById('categoryError').textContent = 'Please select a category.';
            }

            // Validate Message: required
            const message = document.getElementById('message').value.trim();
            if (message === '') {
                isValid = false;
                document.getElementById('messageError').textContent = 'Please enter your message.';
            }

            if (isValid) {
                alert('Thank you for your message! We will get back to you soon.');
                form.reset();
            }
        });
    </script>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-top">
            <div class="footer-col footer-brand">
                <div class="logo">
                    <a href="index.html">
                        <img src="css/imgs/ManukaCo_Long_Cream.png" alt="Mīere Logo">
                    </a>
                </div>
                <div class="social-icons">
                    <img src="css/icons/instagram.svg" alt="Instagram">
                    <img src="css/icons/tiktok.svg" alt="TikTok">
                    <img src="css/icons/x.svg" alt="Twitter">
                    <img src="css/icons/facebook.svg" alt="Facebook">
                    <img src="css/icons/youtube.svg" alt="YouTube">
                </div>
            </div>

            <div class="footer-col">
                <h4>About</h4>
                <p><a href="story.html">Our Story</a></p>
                <p><a href="membership.html">Membership</a></p>
                <p><a href="blog.html">Blog</p></a>
            </div>
            <div class="footer-col">
                <h4>Shop</h4>
                <p><a href="shop-detail.html">Mīere</a></p>
                <p><a href="shop.html">All Products</a></p>
            </div>
            <div class="footer-col">
                <h4>Support</h4>
                <p><a href="faq.html">FAQs</a></p>
                <p><a href="contact.html">Contact Us</a></p>
            </div>
        </div>

        <div class="footer-bottom">
            <p class="left">© 2025 Mīere. All Rights Reserved.</p>
            <div class="right">
                <p><a href=privacy-policy.html>Privacy Policy</p></a>
            </div>
        </div>
    </footer>

    <!-- JavaScript for Mobile Menu Toggle -->
    <script>
        const menu = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');

        menu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menu.classList.toggle('active');
        });
    </script>
</body>

</html>
